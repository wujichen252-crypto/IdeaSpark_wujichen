server
{
    listen 9002;
    server_name 47.108.232.238;
    index index.html index.htm;
    root /www/wwwroot/ideaspark_f/dist;
    
    #CERT-APPLY-CHECK--START
    # 用于SSL证书申请时的文件验证相关配置 -- 请勿删除
    include /www/server/panel/vhost/nginx/well-known/47.108.232.238.conf;
    #CERT-APPLY-CHECK--END
    
    include /www/server/panel/vhost/nginx/extension/47.108.232.238/*.conf;
    
    #SSL-START SSL相关配置，请勿删除或修改下一行带注释的404规则
    #error_page 404/404.html;
    #SSL-END

    #ERROR-PAGE-START  错误页配置，可以注释、删除或修改
    #error_page 404 /404.html;
    #error_page 502 /502.html;
    #ERROR-PAGE-END

    #PHP-INFO-START  PHP引用配置，可以注释或修改
    #include enable-php-00.conf;
    #PHP-INFO-END

    #REWRITE-START URL重写规则引用,修改后将导致面板设置的伪静态规则失效
    #include /www/server/panel/vhost/rewrite/47.108.232.238.conf;
    #REWRITE-END

    # 关键配置：Vue Router History 模式支持，解决刷新 404 问题
    location / {
        try_files $uri $uri/ /index.html last;
        index index.html;
    }

    # 关键配置：确保子路由下的资源请求能正确找到文件
    # 处理 /workbench/*、/project/* 等子路由下的资源请求
    location ~ ^/(workbench|project|workspace|profile|settings|admin|community|market|tools|ai|notifications|teams)/.*\.(js|css|woff2?|ttf|eot|svg|png|jpg|jpeg|gif|ico|webp|mp4|webm|ogg)$ {
        # 将子路由下的资源请求重定向到根目录
        rewrite ^/(workbench|project|workspace|profile|settings|admin|community|market|tools|ai|notifications|teams)/(.*)$ /$2 break;
        try_files $uri $uri/ =404;
        expires 12h;
    }

    # 关键配置：API 反向代理到 9000 端口（保留 /api 路径）
    location /api/ {
        proxy_pass http://47.108.232.238:9000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 60s;
        proxy_send_timeout 60s;
        proxy_read_timeout 60s;
    }

    #禁止访问的文件或目录
    location ~ ^/(\.user.ini|\.htaccess|\.git|\.env|\.svn|\.project|LICENSE|README.md)
    {
        return 404;
    }

    #一键申请SSL证书验证目录相关设置
    location ~ \.well-known{
        allow all;
    }

    #禁止在证书验证目录放入敏感文件
    if ( $uri ~ "^/\.well-known/.*\.(php|jsp|py|js|css|lua|ts|go|zip|tar\.gz|rar|7z|sql|bak)$" ) {
        return 403;
    }

    location ~ .*\.(gif|jpg|jpeg|png|bmp|swf)$
    {
        expires      30d;
        error_log /dev/null;
        access_log /dev/null;
    }

    location ~ .*\.(js|css)?$
    {
        expires      12h;
        error_log /dev/null;
        access_log /dev/null;
    }
    access_log  /www/wwwlogs/47.108.232.238.log;
    error_log  /www/wwwlogs/47.108.232.238.error.log;
}
