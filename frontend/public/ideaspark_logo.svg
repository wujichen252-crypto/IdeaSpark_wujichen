<?xml version="1.0" encoding="UTF-8"?>
<svg width="900" height="350" viewBox="0 0 900 350" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- 荧光绿渐变 -->
    <linearGradient id="neonGradient" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#39FF14;stop-opacity:1" />
      <stop offset="50%" style="stop-color:#4ADE80;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#22C55E;stop-opacity:1" />
    </linearGradient>
    
    <!-- 发光滤镜 -->
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="4" result="coloredBlur"/>
      <feMerge>
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    
    <!-- 强发光滤镜 -->
    <filter id="strongGlow" x="-100%" y="-100%" width="300%" height="300%">
      <feGaussianBlur stdDeviation="8" result="blur1"/>
      <feGaussianBlur stdDeviation="15" result="blur2"/>
      <feMerge>
        <feMergeNode in="blur2"/>
        <feMergeNode in="blur1"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>
  
  <!-- 背景（透明） -->
  <rect width="900" height="350" fill="transparent"/>
  
  <!-- 火花装饰 - 左上 -->
  <g transform="translate(100, 100)" filter="url(#glow)">
    <path d="M0,-15 L3,-3 L15,0 L3,3 L0,15 L-3,3 L-15,0 L-3,-3 Z" fill="#39FF14"/>
  </g>
  
  <!-- 火花装饰 - 右上 -->
  <g transform="translate(780, 130) scale(0.8)" filter="url(#glow)">
    <path d="M0,-15 L3,-3 L15,0 L3,3 L0,15 L-3,3 L-15,0 L-3,-3 Z" fill="#39FF14"/>
  </g>
  
  <!-- 火花装饰 - 左下 -->
  <g transform="translate(120, 260) scale(0.6)" filter="url(#glow)">
    <path d="M0,-15 L3,-3 L15,0 L3,3 L0,15 L-3,3 L-15,0 L-3,-3 Z" fill="#39FF14"/>
  </g>
  
  <!-- 火花装饰 - 右中 -->
  <g transform="translate(820, 200) scale(0.7)" filter="url(#glow)">
    <path d="M0,-15 L3,-3 L15,0 L3,3 L0,15 L-3,3 L-15,0 L-3,-3 Z" fill="#39FF14"/>
  </g>
  
  <!-- 主文字 IdeaSpark -->
  <g transform="translate(450, 200)" text-anchor="middle" filter="url(#strongGlow)">
    <!-- 阴影层 -->
    <text x="4" y="4" 
          font-family="'Brush Script MT', 'Comic Sans MS', cursive" 
          font-size="130" 
          font-weight="bold"
          fill="#0D5C28"
          opacity="0.5">IdeaSpark</text>
    
    <!-- 主文字 -->
    <text x="0" y="0" 
          font-family="'Brush Script MT', 'Comic Sans MS', cursive" 
          font-size="130" 
          font-weight="bold"
          fill="url(#neonGradient)"
          style="letter-spacing: 2px;">IdeaSpark</text>
    
    <!-- 高光 -->
    <text x="-2" y="-2" 
          font-family="'Brush Script MT', 'Comic Sans MS', cursive" 
          font-size="130" 
          font-weight="bold"
          fill="#96FF96"
          opacity="0.6">IdeaSpark</text>
  </g>
</svg>