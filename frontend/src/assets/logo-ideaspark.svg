<?xml version="1.0" encoding="UTF-8"?>
<svg width="600" height="200" viewBox="0 0 600 200" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="neonGradient" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#39FF14;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#4ADE80;stop-opacity:1" />
    </linearGradient>
    
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="3" result="coloredBlur"/>
      <feMerge>
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>
  
  <rect width="600" height="200" fill="transparent"/>
  
  <!-- 小火花 -->
  <g transform="translate(40, 100) scale(0.7)" filter="url(#glow)">
    <path d="M0,-15 L3,-3 L15,0 L3,3 L0,15 L-3,3 L-15,0 L-3,-3 Z" fill="#39FF14"/>
  </g>
  
  <g transform="translate(560, 110) scale(0.5)" filter="url(#glow)">
    <path d="M0,-15 L3,-3 L15,0 L3,3 L0,15 L-3,3 L-15,0 L-3,-3 Z" fill="#39FF14"/>
  </g>
  
  <!-- 文字 -->
  <g transform="translate(300, 120)" text-anchor="middle" filter="url(#glow)">
    <text x="2" y="2" 
          font-family="'Brush Script MT', 'Comic Sans MS', cursive" 
          font-size="90" 
          font-weight="bold"
          fill="#0D5C28"
          opacity="0.4">IdeaSpark</text>
    
    <text x="0" y="0" 
          font-family="'Brush Script MT', 'Comic Sans MS', cursive" 
          font-size="90" 
          font-weight="bold"
          fill="url(#neonGradient)">IdeaSpark</text>
  </g>
</svg>