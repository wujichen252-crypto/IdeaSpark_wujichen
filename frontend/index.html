<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/ideaspark_icon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="IdeaSpark - 从灵感到落地，只需一句话。AI驱动的创意孵化平台，帮助你把想法变成可交付的项目资产。" />
    <title>IdeaSpark - 从灵感到落地，只需一句话</title>
    
    <!-- 预连接关键域名 -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link rel="dns-prefetch" href="https://fonts.googleapis.com">
    <link rel="dns-prefetch" href="https://fonts.gstatic.com">
    
    <!-- 预加载关键资源已移除，避免 preload 警告 -->
    
    <!-- 异步加载字体 -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=Playfair+Display:ital,wght@0,400;0,600;1,400&display=swap" rel="stylesheet" media="print" onload="this.media='all'">
    <noscript><link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=Playfair+Display:ital,wght@0,400;0,600;1,400&display=swap" rel="stylesheet"></noscript>
    
    <!-- 关键CSS内联 -->
    <style>
      /* 首屏关键样式 - 防止FOUC */
      html, body { margin: 0; padding: 0; }
      body { background-color: #000; color: #fff; font-family: system-ui, -apple-system, sans-serif; }
      #app { min-height: 100vh; }
      /* 骨架屏样式 */
      .skeleton { background: linear-gradient(90deg, #1a1a1a 25%, #2a2a2a 50%, #1a1a1a 75%); background-size: 200% 100%; animation: shimmer 1.5s infinite; }
      @keyframes shimmer { 0% { background-position: 200% 0; } 100% { background-position: -200% 0; } }
    </style>
  </head>
  <body>
    <div id="app"></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
