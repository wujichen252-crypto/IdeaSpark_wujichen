<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/ideaspark_icon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="IdeaSpark - 从灵感到落地，只需一句话。AI驱动的创意孵化平台，帮助你把想法变成可交付的项目资产。" />
    <title>IdeaSpark - 从灵感到落地，只需一句话</title>

    <!-- 关键CSS内联：与 styles/variables.scss 的 --nexus-bg / --nexus-text-primary / --nexus-font-ui 保持一致 -->
    <style>
      /* 首屏关键样式 - 防止FOUC：底色与正式样式同源，避免黑底闪白 */
      html, body { margin: 0; padding: 0; }
      body {
        background-color: #fafafa;
        color: #111827;
        font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', 'HarmonyOS Sans SC',
          'Source Han Sans SC', 'Noto Sans SC', 'PingFang SC', 'Microsoft YaHei', Roboto, sans-serif;
      }
      #app { min-height: 100vh; }
      /* 骨架屏样式（浅色底适配） */
      .skeleton { background: linear-gradient(90deg, #ececec 25%, #f5f5f5 50%, #ececec 75%); background-size: 200% 100%; animation: shimmer 1.5s infinite; }
      @keyframes shimmer { 0% { background-position: 200% 0; } 100% { background-position: -200% 0; } }
      /* 系统开启"减弱动效"时关闭骨架动画 */
      @media (prefers-reduced-motion: reduce) { .skeleton { animation: none; } }
    </style>
  </head>
  <body>
    <div id="app"></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
