[project]
name = "ideaspark-backend"
version = "0.1.0"
description = "IdeaSpark Django backend — AI-driven project incubator"
requires-python = ">=3.11"
dependencies = [
    "Django==4.2.16",
    "django-ninja==1.6.0",
    "gunicorn==23.0.0",
    "uvicorn==0.33.0",
    "mysqlclient==2.2.4",
    "django-cors-headers==4.3.0",
    "PyJWT==2.10.1",
    "python-dotenv==1.0.1",
    "oss2==2.18.6",
    "httpx==0.28.1",
    "python-docx==1.1.2",
    "openpyxl==3.1.5",
    "python-pptx==1.0.2",
    "django-prometheus==2.5.0",
    "prometheus-client==0.25.0",
    "openai>=1.0",
]

[dependency-groups]
dev = ["ruff>=0.11.0"]

[tool.uv]
package = false

[tool.ruff]
line-length = 120
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W", "UP"]

[tool.ruff.format]
quote-style = "single"
