[project]
name = "ideaspark-backend"
version = "0.1.0"
description = "IdeaSpark Django backend — AI-driven project incubator"
requires-python = ">=3.11"
dependencies = [
    "Django==4.2.16",
    "django-ninja==1.6.0",
    "gunicorn==23.0.0",
    "uvicorn==0.33.0",
    "mysqlclient==2.2.4",
    "django-cors-headers==4.3.0",
    "PyJWT==2.10.1",
    "python-dotenv==1.0.1",
    "oss2==2.18.6",
    "httpx==0.28.1",
    "python-docx==1.1.2",
    "openpyxl==3.1.5",
    "python-pptx==1.0.2",
    "django-prometheus==2.5.0",
    "prometheus-client==0.25.0",
    "openai>=1.0",
]

[dependency-groups]
dev = ["ruff>=0.11.0"]

[tool.uv]
package = false

[tool.ruff]
line-length = 120
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W", "UP"]
ignore = [
    "N815", # Pydantic schema 字段必须保持 camelCase，与前端 API 契约一致
    "N803", # 查询参数名与前端契约一致（如 pluginKey）
    "N818", # 异常类名沿用历史契约 BusinessException 等，改动收益低
    "UP045",# Optional[X] 写法保留，兼容 Pydantic v1 风格
    "UP006",# List/Dict 旧写法保留，避免与 Pydantic 序列化行为耦合
    "UP017",# datetime.timezone.utc 统一为常量写法，避免行为差异
    "UP035",# 部分 deprecated import 由第三方库类型提示依赖
    "E501", # 中文注释/长 URL 超行不强制折行
]

[tool.ruff.format]
quote-style = "single"
