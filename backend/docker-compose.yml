# =============================================================================
# IdeaSpark Backend — Docker Compose
#
# 适用场景:
#   1. 本地开发测试
#   2. 1Panel 导入部署（Container → Compose）
#
# 注意: MySQL 为外部数据库（47.108.232.238:3306），不在本 compose 内
# =============================================================================

version: "3.8"

services:
  backend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: ideapark-backend
    restart: unless-stopped
    ports:
      - "${SERVER_PORT:-9001}:9001"
    environment:
      # ── Django Core ──
      DJANGO_SECRET_KEY: ${DJANGO_SECRET_KEY}
      DJANGO_DEBUG: "${DJANGO_DEBUG:-false}"
      ALLOWED_HOSTS: "${ALLOWED_HOSTS:-localhost,127.0.0.1}"

      # ── Database ──
      DB_HOST: ${DB_HOST}
      DB_PORT: "${DB_PORT:-3306}"
      DB_NAME: ${DB_NAME:-ideaspark}
      DB_USERNAME: ${DB_USERNAME:-ideaspark}
      DB_PASSWORD: ${DB_PASSWORD}
      DB_CONN_MAX_AGE: "${DB_CONN_MAX_AGE:-600}"
      DB_CONN_TIMEOUT: "${DB_CONN_TIMEOUT:-30}"

      # ── JWT ──
      JWT_SECRET: ${JWT_SECRET}
      JWT_EXPIRE_SECONDS: "${JWT_EXPIRE_SECONDS:-604800}"
      JWT_REFRESH_EXPIRE_SECONDS: "${JWT_REFRESH_EXPIRE_SECONDS:-2592000}"
      JWT_ISSUER: "${JWT_ISSUER:-ideaspark}"

      # ── CORS ──
      CORS_ALLOWED_ORIGINS: "${CORS_ALLOWED_ORIGINS}"

      # ── OSS (Aliyun) ──
      OSS_ENABLED: "${OSS_ENABLED:-true}"
      OSS_ENDPOINT: "${OSS_ENDPOINT:-https://oss-cn-beijing.aliyuncs.com}"
      OSS_ACCESS_KEY_ID: ${OSS_ACCESS_KEY_ID:-}
      OSS_ACCESS_KEY_SECRET: ${OSS_ACCESS_KEY_SECRET:-}
      OSS_BUCKET: "${OSS_BUCKET:-ideaspark}"
      OSS_BASE_DIR: "${OSS_BASE_DIR:-uploads}"

      # ── DeepSeek AI ──
      DEEPSEEK_API_KEY: ${DEEPSEEK_API_KEY:-}
      DEEPSEEK_BASE_URL: "${DEEPSEEK_BASE_URL:-https://api.deepseek.com}"
      DEEPSEEK_MODEL: "${DEEPSEEK_MODEL:-deepseek-chat}"
      DEEPSEEK_TEMPERATURE: "${DEEPSEEK_TEMPERATURE:-0.7}"
      DEEPSEEK_MAX_TOKENS: "${DEEPSEEK_MAX_TOKENS:-2000}"

      # ── Email ──
      EMAIL_HOST: ${EMAIL_HOST:-}
      EMAIL_PORT: "${EMAIL_PORT:-587}"
      EMAIL_HOST_USER: ${EMAIL_HOST_USER:-}
      EMAIL_HOST_PASSWORD: ${EMAIL_HOST_PASSWORD:-}
      EMAIL_USE_TLS: "${EMAIL_USE_TLS:-true}"
      DEFAULT_FROM_EMAIL: ${DEFAULT_FROM_EMAIL:-}

      # ── Frontend URL ──
      FRONTEND_URL: "${FRONTEND_URL}"

      # ── Server ──
      SERVER_PORT: "${SERVER_PORT:-9001}"
      GUNICORN_WORKERS: "${GUNICORN_WORKERS:-4}"
      GUNICORN_TIMEOUT: "${GUNICORN_TIMEOUT:-120}"
      LOG_LEVEL: "${LOG_LEVEL:-INFO}"
      APP_LOG_LEVEL: "${APP_LOG_LEVEL:-INFO}"
    volumes:
      # Log persistence
      - ideapark-logs:/app/logs
      # Static files
      - ideapark-static:/app/staticfiles
    networks:
      - ideapark-net
    healthcheck:
      test: ["CMD", "curl", "-sSf", "http://localhost:9001/ping"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 40s

  # ── (可选) Nginx 反代，按需启用 ──────────────────────────
  # nginx:
  #   image: nginx:alpine
  #   container_name: ideapark-nginx
  #   restart: unless-stopped
  #   ports:
  #     - "80:80"
  #     - "443:443"
  #   volumes:
  #     - ./deploy/nginx.conf:/etc/nginx/conf.d/default.conf:ro
  #     - ideapark-static:/app/staticfiles:ro
  #     - /etc/letsencrypt:/etc/letsencrypt:ro
  #   depends_on:
  #     backend:
  #       condition: service_healthy
  #   networks:
  #     - ideapark-net

volumes:
  ideapark-logs:
  ideapark-static:

networks:
  ideapark-net:
    driver: bridge
